name: Actualizar rating GBP

on:
  schedule:
    # Lunes 14:00 UTC ≈ 08:00 CDMX
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gbp-rating
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: AP-Claude

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync rating + reviewCount desde Places API
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node scripts/update-gbp-rating.mjs

      - name: Commit si hubo cambios
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html ubicacion/index.html zonas/*/index.html neumologo-en-hospital-santa-coleta/index.html promociones/*/index.html
            git commit -m "chore(gbp): sync rating/reviewCount desde GBP"
            git push origin HEAD:AP-Claude
          else
            echo "Sin cambios — nada que commitear"
          fi
