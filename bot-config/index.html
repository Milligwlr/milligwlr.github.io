<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Panel del bot — alveos</title>
<style>
  /* ===== Tokens (estilo Ajustes de iOS, con la identidad verde del bot) ===== */
  :root {
    --bg: #f2f2f7; --surface: #ffffff; --surface-2: #ffffff; --inset: #efeff4;
    --ink: #1c1c1e; --ink-2: #545459; --ink-3: #6d6d72;
    --sep: rgba(60,60,67,.16); --sep-fuerte: rgba(60,60,67,.28);
    --acento: #00a884; --acento-2: #12b886; --acento-txt: #ffffff;
    --rojo: #e53935; --ambar: #b26a00; --verde: #1a8f5c; --azul: #0a84c4;
    --naranja: #d9730d; --indigo: #5b5bd6; --rosa: #c2418a;
    --chip-bg: rgba(120,120,128,.12);
    --sombra: 0 1px 2px rgba(11,20,26,.06);
    --sombra-flotante: 0 8px 30px rgba(11,20,26,.16);
    --nav-bg: rgba(248,248,250,.82);
    --r-grande: 18px; --r-media: 12px; --r-chica: 9px;
    --ease-out: cubic-bezier(.23,1,.32,1);
    --ease-drawer: cubic-bezier(.32,.72,0,1);
    --tab-h: 58px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --surface: #1c1c1e; --surface-2: #1c1c1e; --inset: #2c2c2e;
      --ink: #f5f5f7; --ink-2: #a9a9b0; --ink-3: #8a8a8f;
      --sep: rgba(84,84,88,.4); --sep-fuerte: rgba(120,120,128,.5);
      --acento: #16c295; --acento-2: #1ad1a3; --acento-txt: #00110c;
      --rojo: #ff453a; --ambar: #ffb757; --verde: #30d38b; --azul: #4ab8ec;
      --naranja: #ff9f45; --indigo: #7d7dee; --rosa: #e06aa8;
      --chip-bg: rgba(120,120,128,.24);
      --sombra: 0 1px 2px rgba(0,0,0,.4);
      --sombra-flotante: 0 10px 34px rgba(0,0,0,.55);
      --nav-bg: rgba(20,20,22,.78);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { height: 100%; }
  body {
    min-height: 100%; background: var(--bg); color: var(--ink);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overscroll-behavior-y: none;
  }
  button { font: inherit; background: none; border: 0; cursor: pointer; color: inherit; }
  input, textarea, select { font: inherit; color: var(--ink); }
  svg { display: block; }
  h1, h2, h3 { font-weight: 700; letter-spacing: -.02em; }

  /* ===== Cabecera ===== */
  #cabecera {
    position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 6px;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    background: var(--nav-bg); backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--sep);
  }
  #cabecera .titulo { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
  .btn-nav {
    width: 40px; height: 34px; border-radius: 9px; display: inline-flex; align-items: center;
    justify-content: center; color: var(--acento); flex: none; transition: transform .16s var(--ease-out), background .16s;
  }
  .btn-nav:active { transform: scale(.9); background: var(--chip-bg); }
  .btn-nav svg { width: 24px; height: 24px; }
  .btn-nav.atras { width: auto; padding: 0 6px 0 2px; gap: 1px; font-size: 17px; font-weight: 400; }
  .btn-nav.girando svg { animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* ===== Vista / layout ===== */
  #vista { max-width: 720px; margin: 0 auto; padding: 4px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 40px); }
  .grande { font-size: 30px; line-height: 1.1; margin: 16px 2px 4px; letter-spacing: -.03em; }
  .grande-sub { color: var(--ink-2); font-size: 14.5px; margin: 0 2px 18px; }
  .seccion-tit { font-size: 13px; font-weight: 600; letter-spacing: .01em; text-transform: uppercase;
    color: var(--ink-3); margin: 26px 16px 7px; }
  .seccion-tit:first-child { margin-top: 10px; }

  /* Grupo de lista tipo iOS */
  .grupo { background: var(--surface); border-radius: var(--r-media); box-shadow: var(--sombra); overflow: hidden; }
  .grupo + .grupo-nota, .nota { color: var(--ink-3); font-size: 12.5px; margin: 7px 16px 0; line-height: 1.4; }
  .fila {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 52px;
    position: relative; background: var(--surface); text-align: left; width: 100%;
  }
  .fila + .fila::before {
    content: ''; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep);
  }
  .fila.tocable { transition: background .12s; }
  .fila.tocable:active { background: var(--inset); }
  .fila .cuerpo { flex: 1; min-width: 0; }
  .fila .t { font-size: 16px; line-height: 1.25; }
  .fila .d { font-size: 12.7px; color: var(--ink-2); line-height: 1.35; margin-top: 2px; }
  .fila .chevron { color: var(--ink-3); flex: none; }
  .fila .chevron svg { width: 18px; height: 18px; }
  .fila .valor-der { color: var(--ink-2); font-size: 15px; flex: none; max-width: 45%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }

  /* Ícono cuadrado tipo iOS */
  .ico-cuad { width: 30px; height: 30px; border-radius: 7px; flex: none; display: flex;
    align-items: center; justify-content: center; font-size: 17px; color: #fff; }

  /* ===== Switch ===== */
  .sw {
    position: relative; width: 51px; height: 31px; border-radius: 999px; flex: none;
    background: var(--sep-fuerte); transition: background .22s var(--ease-out); cursor: pointer;
  }
  .sw::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.28), 0 0 1px rgba(0,0,0,.2);
    transition: transform .22s var(--ease-drawer);
  }
  .sw.on { background: var(--acento); }
  .sw.on::after { transform: translateX(20px); }
  .sw.peligro.on { background: var(--rojo); }
  .sw:active::after { width: 30px; }
  .sw.on:active::after { transform: translateX(17px); }
  .sw[aria-disabled="true"] { opacity: .5; pointer-events: none; }

  /* ===== Campo de texto / precio ===== */
  .campo-fila { flex-wrap: wrap; }
  .campo-fila .cuerpo { flex: 1 1 100%; }
  .entrada-linea { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 8px; }
  .entrada {
    flex: 1; background: var(--inset); border: 1px solid transparent; border-radius: var(--r-chica);
    padding: 10px 12px; font-size: 16px; outline: none; min-width: 0; transition: border-color .15s, background .15s;
  }
  textarea.entrada { min-height: 46px; resize: vertical; line-height: 1.4; }
  .entrada:focus { border-color: var(--acento); background: var(--surface); }
  .entrada::placeholder { color: var(--ink-3); }
  .btn-guardar {
    flex: none; background: var(--inset); color: var(--ink-3); border-radius: var(--r-chica);
    padding: 10px 15px; font-size: 14.5px; font-weight: 600; min-width: 92px; text-align: center;
    transition: transform .14s var(--ease-out), background .18s, color .18s;
  }
  .btn-guardar:active { transform: scale(.96); }
  .btn-guardar.cambiado { background: var(--acento); color: var(--acento-txt); }
  .btn-guardar[disabled] { opacity: .6; }

  /* ===== Stepper ===== */
  .stepper { display: inline-flex; align-items: center; background: var(--inset); border-radius: 9px; flex: none; }
  .stepper button {
    width: 42px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--acento);
    transition: transform .12s var(--ease-out), background .12s;
  }
  .stepper button:active { transform: scale(.86); }
  .stepper button[disabled] { color: var(--ink-3); opacity: .5; }
  .stepper button svg { width: 19px; height: 19px; }
  .stepper .div { width: .5px; align-self: stretch; background: var(--sep-fuerte); }
  .stepper-val { min-width: 62px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums;
    color: var(--ink-2); flex: none; }
  input[type="time"].entrada { flex: none; width: auto; }

  /* ===== Estado / salud ===== */
  .estado-hero { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--surface);
    border-radius: var(--r-media); box-shadow: var(--sombra); }
  .estado-hero .medallon { width: 46px; height: 46px; border-radius: 50%; flex: none; display: flex;
    align-items: center; justify-content: center; }
  .estado-hero .medallon.ok { background: color-mix(in srgb, var(--verde) 18%, transparent); color: var(--verde); }
  .estado-hero .medallon.mal { background: color-mix(in srgb, var(--rojo) 18%, transparent); color: var(--rojo); }
  .estado-hero .medallon svg { width: 26px; height: 26px; }
  .estado-hero .et { font-size: 17px; font-weight: 600; }
  .estado-hero .es { font-size: 13px; color: var(--ink-2); margin-top: 1px; }

  .punto { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .punto.ok { background: var(--verde); } .punto.mal { background: var(--rojo); }

  /* ===== Alertas ===== */
  .alerta { display: flex; align-items: flex-start; gap: 11px; padding: 13px 14px; border-radius: var(--r-media);
    background: var(--surface); box-shadow: var(--sombra); margin-bottom: 10px; }
  .alerta .barra { width: 3px; align-self: stretch; border-radius: 3px; flex: none; }
  .alerta.warn .barra { background: var(--ambar); } .alerta.mal .barra { background: var(--rojo); }
  .alerta.info .barra { background: var(--azul); }
  .alerta .ico { flex: none; margin-top: 1px; }
  .alerta .ico svg { width: 20px; height: 20px; }
  .alerta.warn .ico { color: var(--ambar); } .alerta.mal .ico { color: var(--rojo); } .alerta.info .ico { color: var(--azul); }
  .alerta .txt { flex: 1; min-width: 0; }
  .alerta .txt b { font-size: 15px; font-weight: 600; display: block; }
  .alerta .txt span { font-size: 13px; color: var(--ink-2); display: block; margin-top: 1px; }
  .alerta .ir { color: var(--acento); flex: none; align-self: center; }
  .alerta .ir svg { width: 18px; height: 18px; }

  /* ===== Mosaicos de métricas ===== */
  .mosaicos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 11px; }
  .mosaico { background: var(--surface); border-radius: var(--r-media); padding: 14px; box-shadow: var(--sombra); position: relative; }
  .mosaico .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }
  .mosaico .e { color: var(--ink-2); font-size: 12.5px; margin-top: 6px; line-height: 1.3; }
  .mosaico .e b { color: var(--ink); font-weight: 600; display: block; font-size: 13px; }
  .mosaico.destacado { background: color-mix(in srgb, var(--acento) 12%, var(--surface)); }
  .mosaico.destacado .v { color: var(--acento); }

  /* Segmented control */
  .segmento { display: inline-flex; background: var(--chip-bg); border-radius: 9px; padding: 2px; margin: 2px 0 14px; }
  .segmento button { border-radius: 7px; padding: 6px 16px; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
    transition: color .15s; position: relative; }
  .segmento button.activo { color: var(--ink); background: var(--surface); box-shadow: var(--sombra); }

  /* ===== Agenda ===== */
  .cita { display: flex; align-items: center; gap: 12px; padding: 11px 16px; position: relative; }
  .cita + .cita::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
  .cita .hora { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 52px; flex: none; }
  .cita .hora .dia { display: block; font-size: 11px; color: var(--ink-3); font-weight: 500; }
  .cita .quien { flex: 1; min-width: 0; }
  .cita .quien .n { font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cita .quien .m { font-size: 12.5px; color: var(--ink-2); }
  .cita .semaforo { font-size: 13px; flex: none; }

  /* Chips de plantillas / campañas */
  .plantilla { display: flex; align-items: center; gap: 8px; padding: 11px 16px; flex-wrap: wrap; position: relative; }
  .plantilla + .plantilla::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
  .plantilla .nom { flex: 1; min-width: 150px; font-size: 14px; }
  .chip { border-radius: 999px; padding: 2px 10px; font-size: 11.5px; font-weight: 600; background: var(--chip-bg); color: var(--ink-2); white-space: nowrap; }
  .chip.aprobada { color: var(--verde); background: color-mix(in srgb, var(--verde) 15%, transparent); }
  .chip.pendiente { color: var(--ambar); background: color-mix(in srgb, var(--ambar) 15%, transparent); }
  .chip.rechazada { color: var(--rojo); background: color-mix(in srgb, var(--rojo) 15%, transparent); }
  .chip.marketing { color: var(--indigo); background: color-mix(in srgb, var(--indigo) 15%, transparent); }
  .etq-fila { display: flex; gap: 9px; flex-wrap: wrap; padding: 14px 16px; }
  .etq { display: inline-flex; align-items: baseline; gap: 6px; border-radius: 999px; padding: 6px 13px;
    background: var(--chip-bg); font-size: 13px; }
  .etq b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Botones grandes de acción */
  .accion { display: flex; align-items: center; gap: 13px; padding: 13px 16px; position: relative; width: 100%; text-align: left; text-decoration: none; color: inherit; }
  .accion + .accion::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
  .accion:active { background: var(--inset); }
  .accion .ico-cuad { }
  .accion .txt { flex: 1; }
  .accion .txt .t { font-size: 16px; }
  .accion .txt .d { font-size: 12.5px; color: var(--ink-2); }
  .accion .chevron { color: var(--ink-3); }
  .accion .chevron svg { width: 18px; height: 18px; }

  /* Cambios recientes */
  .cambio { font-size: 12.7px; color: var(--ink-2); padding: 8px 16px; position: relative; font-variant-numeric: tabular-nums; }
  .cambio + .cambio::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
  .cambio .h { color: var(--ink-3); }

  /* ===== Modo edición (personalización) ===== */
  .tarjeta-mov { position: relative; }
  .tarjeta-mov.arrastrando { z-index: 5; box-shadow: var(--sombra-flotante); transform: scale(1.02); opacity: .97; }
  .mando-edit { display: flex; align-items: center; gap: 6px; padding: 6px 4px 10px; }
  .mando-edit .agarre { color: var(--ink-3); touch-action: none; cursor: grab; padding: 4px; }
  .mando-edit .agarre svg { width: 22px; height: 22px; }
  .mando-edit .titmov { flex: 1; font-size: 13px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .02em; }
  .mando-edit .mini { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    background: var(--chip-bg); color: var(--acento); }
  .mando-edit .mini[disabled] { opacity: .35; color: var(--ink-3); }
  .mando-edit .mini svg { width: 18px; height: 18px; }
  .mando-edit .ojo.oculto { color: var(--ink-3); }
  .oculto-en-edit { opacity: .5; }
  .tile-check { position: absolute; top: 9px; right: 9px; width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--sep-fuerte); display: flex; align-items: center; justify-content: center; color: transparent; }
  .tile-check.on { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tile-check svg { width: 14px; height: 14px; }
  .banner-edit { background: color-mix(in srgb, var(--acento) 14%, var(--surface)); border-radius: var(--r-media);
    padding: 11px 14px; font-size: 13px; color: var(--ink); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .banner-edit .restaurar { margin-left: auto; color: var(--acento); font-weight: 600; font-size: 13.5px; flex: none; }

  /* ===== Tab bar ===== */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: flex;
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--nav-bg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--sep);
  }
  #tabbar button { flex: 1; height: var(--tab-h); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; color: var(--ink-3); transition: color .15s; }
  #tabbar button.activo { color: var(--acento); }
  #tabbar button svg { width: 26px; height: 26px; }
  #tabbar button .lbl { font-size: 10.5px; font-weight: 500; letter-spacing: .01em; }
  #tabbar button:active svg { transform: scale(.88); transition: transform .12s var(--ease-out); }

  /* ===== Toast ===== */
  #aviso {
    position: fixed; left: 50%; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);
    transform: translateX(-50%) translateY(14px); z-index: 60;
    background: var(--ink); color: var(--bg); border-radius: 14px; padding: 11px 8px 11px 16px;
    font-size: 14px; box-shadow: var(--sombra-flotante); display: flex; align-items: center; gap: 10px;
    max-width: min(92vw, 440px); opacity: 0; pointer-events: none;
    transition: opacity .22s var(--ease-out), transform .22s var(--ease-out);
  }
  #aviso.visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #aviso .msg { flex: 1; }
  #aviso .accion-toast { flex: none; color: var(--acento-2); font-weight: 700; padding: 4px 10px; border-radius: 8px; }
  #aviso .accion-toast:active { background: rgba(255,255,255,.12); }

  /* ===== Action sheet ===== */
  #hoja-fondo { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.4); opacity: 0;
    transition: opacity .25s var(--ease-out); pointer-events: none; }
  #hoja-fondo.visible { opacity: 1; pointer-events: auto; }
  #hoja { position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px);
    transform: translateY(110%); transition: transform .32s var(--ease-drawer); }
  #hoja.visible { transform: translateY(0); }
  #hoja .panel { background: var(--surface); border-radius: 16px; overflow: hidden; margin-bottom: 8px; }
  #hoja .cab { padding: 16px; text-align: center; border-bottom: .5px solid var(--sep); }
  #hoja .cab .ti { font-size: 16px; font-weight: 700; }
  #hoja .cab .ms { font-size: 13.5px; color: var(--ink-2); margin-top: 5px; line-height: 1.4; }
  #hoja .opt { width: 100%; padding: 15px; font-size: 17px; color: var(--azul); text-align: center; }
  #hoja .opt + .opt { border-top: .5px solid var(--sep); }
  #hoja .opt:active { background: var(--inset); }
  #hoja .opt.peligro { color: var(--rojo); font-weight: 600; }
  #hoja .cancelar { width: 100%; padding: 16px; font-size: 17px; font-weight: 700; color: var(--acento);
    background: var(--surface); border-radius: 16px; }
  #hoja .cancelar:active { background: var(--inset); }

  /* ===== Skeleton ===== */
  .sk { background: linear-gradient(90deg, var(--inset) 25%, color-mix(in srgb, var(--inset) 60%, var(--surface)) 50%, var(--inset) 75%);
    background-size: 200% 100%; animation: brillo 1.3s ease-in-out infinite; border-radius: 8px; }
  @keyframes brillo { to { background-position: -200% 0; } }
  .sk-fila { height: 52px; margin-bottom: 1px; }

  /* ===== Puerta ===== */
  #puerta { position: fixed; inset: 0; background: var(--bg); z-index: 90; display: flex; align-items: center;
    justify-content: center; padding: 24px; }
  #puerta form { width: 100%; max-width: 360px; text-align: center; }
  #puerta .marca { width: 66px; height: 66px; border-radius: 20px; background: var(--acento); display: flex;
    align-items: center; justify-content: center; margin: 0 auto 18px; box-shadow: var(--sombra-flotante); }
  #puerta .marca svg { width: 36px; height: 36px; color: #fff; }
  #puerta h2 { font-size: 23px; margin-bottom: 8px; letter-spacing: -.03em; }
  #puerta p { color: var(--ink-2); font-size: 14px; margin-bottom: 22px; line-height: 1.45; }
  #puerta input { width: 100%; background: var(--surface); border: 1px solid var(--sep-fuerte); border-radius: 12px;
    padding: 14px; font-size: 17px; margin-bottom: 12px; outline: none; text-align: center; }
  #puerta input:focus { border-color: var(--acento); }
  #puerta button[type=submit] { width: 100%; background: var(--acento); border-radius: 12px; color: var(--acento-txt);
    font-weight: 700; padding: 15px; font-size: 17px; transition: transform .14s var(--ease-out); }

  var CLAVES_OCULTAS = { PANEL_LAYOUT: true }; // internas: nunca se muestran como campo editable

  function humaniza(clave) {

      .replace(/\bprecio\b/, 'precio').replace(/\bwilliam\b/g, '').replace(/\burl\b/g, '(link)').trim();

    var srvG = (estado.datos && estado.datos.grupos) || null;

    Object.keys(GRUPOS_DEF).forEach(function (id) { mapa[id] = Object.assign({ id: id }, GRUPOS_DEF[id]); });
    if (srvG && typeof srvG === 'object') {
      Object.keys(srvG).forEach(function (id) {
        mapa[id] = Object.assign({ id: id }, mapa[id] || {}, srvG[id]);

    clavesEditables().forEach(function (k) {
      var g = defDe(k).grupo;
      if (!mapa[g]) mapa[g] = { id: g, titulo: humaniza(g), glifo: '⚙️', color: 'var(--ink-3)', sub: '', orden: 99 };
    });
    return Object.keys(mapa).map(function (id) { return mapa[id]; })
      .filter(function (g) { return clavesDeGrupo(g.id).length; })
      .sort(function (a, b) { return (a.orden || 50) - (b.orden || 50); });
  }

    var ed = (estado.datos && estado.datos.editables) || {};
    var claves = Object.keys(ed).length ? Object.keys(ed) : Object.keys(CAMPOS_DEF);
    return claves.filter(function (k) { return !CLAVES_OCULTAS[k] && defDe(k).grupo !== 'interno'; });

    return clavesEditables().filter(function (k) { return defDe(k).grupo === gid; });

  function pedir(params) {
    // Semilla de prueba: en producción window.__panelMock es undefined -> fetch real.
    // El executor de Promise convierte un throw síncrono en rechazo (lo maneja .catch).
    if (window.__panelMock) { return new Promise(function (res) { res(window.__panelMock(params || {})); }); }
    var url = API + '?panel=1&key=' + encodeURIComponent(claveGuardada());
    Object.keys(params || {}).forEach(function (k) { url += '&' + k + '=' + encodeURIComponent(params[k]); });
    var ctrl = null, t = null;
    var carrera = new Promise(function (_res, rej) {
      t = setTimeout(function () { if (ctrl) { try { ctrl.abort(); } catch (e) {} } rej(new Error('tardo')); }, 15000);
    });
    try { ctrl = new AbortController(); } catch (e) { ctrl = null; }
    var f = fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function (r) { return r.json(); });
    return Promise.race([f, carrera]).then(function (j) { clearTimeout(t); return j; },

  /* ================== Toast + Action sheet ================== */
  var avisoTimer = null;

    a.classList.add('visible');

  function ocultaAviso() {

  }

  function accionSheet(opts) {
    // opts: {titulo, mensaje, opciones:[{texto, peligro, fn}]}
    return new Promise(function (resolve) {
      var hoja = $('hoja'), fondo = $('hoja-fondo');
      hoja.textContent = '';
      var panel = nodo('div', 'panel');
      if (opts.titulo || opts.mensaje) {
        var cab = nodo('div', 'cab');
        if (opts.titulo) cab.appendChild(nodo('div', 'ti', opts.titulo));
        if (opts.mensaje) cab.appendChild(nodo('div', 'ms', opts.mensaje));
        panel.appendChild(cab);
      }
      (opts.opciones || []).forEach(function (o) {
        var btn = nodo('button', 'opt' + (o.peligro ? ' peligro' : ''), o.texto);
        btn.type = 'button';
        btn.addEventListener('click', function () { cierra(); if (o.fn) o.fn(); resolve(true); });
        panel.appendChild(btn);
      });
      hoja.appendChild(panel);
      var cancel = nodo('button', 'cancelar', 'Cancelar');
      cancel.type = 'button';
      cancel.addEventListener('click', function () { cierra(); resolve(false); });
      hoja.appendChild(cancel);
      var disparador = document.activeElement;
      function alTeclado(e) { if (e.key === 'Escape') { e.preventDefault(); cierra(); resolve(false); } }
      function cierra() {
        hoja.classList.remove('visible'); fondo.classList.remove('visible');
        fondo.onclick = null;
        document.removeEventListener('keydown', alTeclado, true);
        try { $('app').inert = false; } catch (e) {}
        try { if (disparador && disparador.focus) disparador.focus(); } catch (e) {}
      }
      fondo.onclick = function () { cierra(); resolve(false); };
      try { $('app').inert = true; } catch (e) {} // atrapa el foco/tab fuera de la hoja
      document.addEventListener('keydown', alTeclado, true);

  /* ================== Carga ================== */
  // Caché de arranque (25-jul (6), el Dr. reporta carga lenta, sobre todo en
  // datos móviles): lo ÚLTIMO recibido se guarda en el teléfono y se pinta AL
  // INSTANTE al abrir, mientras lo fresco llega por detrás. Se purga al cerrar
  // sesión (borraClave). Solo es una foto: cualquier dato viejo se reemplaza
  // en cuanto responde el servidor.
  var LS_CACHE = 'panel_cache_v1';
  function leeCachePanel() {
    try {
      var raw = localStorage.getItem(LS_CACHE);
      if (!raw) return null;
      var o = JSON.parse(raw);
      return (o && o.datos && o.datos.ok) ? o : null;
    } catch (e) { return null; }
  }
  function guardaCachePanel(d) {
    try { localStorage.setItem(LS_CACHE, JSON.stringify({ ts: Date.now(), datos: d })); } catch (e) {}
  }
  function carga(claveDirecta) {
    var clave = claveDirecta || claveGuardada();
    if (!clave) { muestraPuerta(false); return; }
    if (claveDirecta) guardaClave(claveDirecta);
    if (estado.cargando) return;
    estado.cargando = true;
    $('btnRefrescar').classList.add('girando');
    // Foto guardada -> pintar YA (solo si aún no hay datos en pantalla).
    if (!estado.datos && !claveDirecta) {
      var cachePan = leeCachePanel();
      if (cachePan) {
        estado.datos = cachePan.datos;
        if (estado.layout === null) cargaLayout(cachePan.datos);
        $('puerta').hidden = true; $('app').hidden = false;
        pinta();
        var min = Math.round((Date.now() - cachePan.ts) / 60000);
        avisa(min <= 1 ? 'Mostrando lo último guardado; actualizando…'
          : 'Mostrando lo de hace ' + min + ' min; actualizando…');
      }
    }
    if (!$('app').hidden && estado.datos) setBarra();
    pedir({}).then(function (d) {
      if (!d || !d.ok) {
        if (d && d.error === 'no autorizado') { borraClave(); muestraPuerta(true); return; }
        throw new Error((d && d.error) || 'respuesta inválida');
      }
      guardaCachePanel(d);
      estado.datos = d;
      if (estado.layout === null) cargaLayout(d);
      if (estado.ventana === 'd7' && estado.layout && estado.layout.ventana) estado.ventana = estado.layout.ventana;
      $('puerta').hidden = true; $('app').hidden = false;
      pinta();
    }).catch(function () {
      if ($('app').hidden) {
        $('fallo').textContent = 'No hay conexión. Intente de nuevo.';
        $('fallo').style.display = 'block';
        puertaCargando(false);
      } else {
        avisa('No hay conexión. Toque actualizar para reintentar.');
        if (!estado.datos) { pinta(); }
      }
    }).then(function () {
      estado.cargando = false; $('btnRefrescar').classList.remove('girando');
      setBarra();
    });
  }
  function puertaCargando(c) {
    $('clave').hidden = c; $('btnEntrar').hidden = c;

      : 'Acceso exclusivo del Dr. William Lara. Ingrese su clave (la misma del visor de chats).';
  }
  function muestraPuerta(conError) {
    estado.datos = null; estado.editando = false; $('vista').textContent = '';

    $('fallo').textContent = 'Clave incorrecta.'; $('fallo').style.display = conError ? 'block' : 'none';
  }

  /* ================== Guardado de Config ================== */
  function guardaConfig(clave, valor, opts) {
    opts = opts || {};
    if (estado.guardando[clave]) return; // evita doble guardado
    estado.guardando[clave] = true;
    if (opts.antes) opts.antes();
    pedir({ set: clave, valor: valor }).then(function (r) {
      estado.guardando[clave] = false;
      if (!r || !r.ok) throw new Error((r && r.error) || 'no se guardó');
      if (!estado.datos.config) estado.datos.config = {};
      estado.datos.config[clave] = r.valor;
      if (opts.ok) opts.ok(r.valor);
      if (!opts.silencioso) {
        if (opts.prev !== undefined && opts.prev !== r.valor) {
          avisa('Guardado. El bot ya usa el valor nuevo.', {
            etiqueta: 'Deshacer',
            fn: function () { guardaConfig(clave, opts.prev, { ok: opts.ok, silencioso: false, restaurar: true }); }
          });
        } else {
          avisa(opts.restaurar ? 'Valor anterior restaurado.' : 'Guardado. El bot ya usa el valor nuevo.');
        }
      }
    }).catch(function (err) {
      estado.guardando[clave] = false;
      if (opts.err) opts.err();
      var m = (err && err.message === 'tardo') ? 'La conexión tardó demasiado. Intente de nuevo.'
        : (err && err.message) ? err.message : 'No hay conexión.';
      avisa('No se guardó: ' + m);
    });
  }

  /* ================== Layout (personalización) ================== */
  function cargaLayout(d) {
    var l = null;
    try {
      if (d && d.config && d.config.PANEL_LAYOUT) l = JSON.parse(d.config.PANEL_LAYOUT);
    } catch (e) { l = null; }
    if (!l) { try { l = JSON.parse(localStorage.getItem(LS_LAYOUT) || 'null'); } catch (e2) { l = null; } }
    estado.layout = normalizaLayout(l);
  }
  function normalizaLayout(l) {
    l = l || {};
    var def = LAYOUT_DEF;
    var orden = Array.isArray(l.orden) ? l.orden.filter(function (x) { return def.orden.indexOf(x) !== -1; }) : [];
    def.orden.forEach(function (x) { if (orden.indexOf(x) === -1) orden.push(x); });
    var tiles = Array.isArray(l.tiles) ? l.tiles.filter(function (x) { return TILES_TODOS.some(function (t) { return t.id === x; }); }) : def.tiles.slice();
    if (!tiles.length) tiles = def.tiles.slice();
    return { orden: orden, ocultos: (l.ocultos && typeof l.ocultos === 'object') ? l.ocultos : {}, tiles: tiles, ventana: l.ventana === 'd30' ? 'd30' : 'd7' };
  }
  var layoutTimer = null;
  function guardaLayout() {
    var l = estado.layout;
    try { localStorage.setItem(LS_LAYOUT, JSON.stringify(l)); } catch (e) {} // local: inmediato
    // A Config (entre dispositivos) con debounce: reordenar/ocultar dispara muchas micro-acciones;
    // así se escribe UNA sola vez al terminar y no se compite por el ScriptLock del bot.
    if (!(estado.datos && estado.datos.editables && estado.datos.editables.PANEL_LAYOUT)) return;
    clearTimeout(layoutTimer);
    layoutTimer = setTimeout(function () {
      pedir({ set: 'PANEL_LAYOUT', valor: JSON.stringify(estado.layout) }).then(function (r) {
        if (r && r.ok && estado.datos && estado.datos.config) estado.datos.config.PANEL_LAYOUT = r.valor;
      }).catch(function () {});

  }

  function valorTile(id, m) {
    var v = m[estado.ventana] || {};
    if (id === 'conversion') return (v.flujos > 0) ? Math.round(100 * (v.reservas || 0) / v.flujos) + '%' : '—';
    var mapa = { conversaciones: v.conversaciones, flujos: v.flujos, reservas: v.reservas, confirmadas: v.confirmadas, resenas: v.resenas, postcitas: v.postcitas, abandonos: v.abandonos };

  // Subtitulo del mosaico. Para 'abandonos' es DINAMICO (16-jul): si el
  // servidor ya manda el desglose por paso (abandono_slot, etc.) y un paso
  // domina (mas de la mitad de los conocidos), se dice en cual se quedan.
  // Backend viejo (sin campos) o todo en abandono_na -> subtitulo de siempre.
  function subTile(t, m) {
    if (t.id !== 'abandonos') return t.sub;
    var v = m[estado.ventana] || {};
    if (v.abandono_slot === undefined) return t.sub;
    var pasos = {
      doctor: 'al elegir doctor', slot: 'al elegir horario', nombre: 'al dar su nombre',
      motivo: 'al contar el motivo', aviso: 'en el aviso de privacidad'

    var mejor = '', nMejor = 0, total = 0;
    Object.keys(pasos).forEach(function (k) {
      var n = Number(v['abandono_' + k] || 0);
      total += n;
      if (n > nMejor) { nMejor = n; mejor = k; }

    if (!total || nMejor * 2 <= total) return t.sub;
    return 'la mayoría ' + pasos[mejor];

  function calculaAlertas() {

  function campoStepper(def) {
    var min = def.min !== undefined ? Number(def.min) : 0;

    var f = nodo('div', 'fila');
    var cuerpo = nodo('div', 'cuerpo');
    cuerpo.appendChild(nodo('div', 't', def.etiqueta));
    if (def.peq) cuerpo.appendChild(nodo('div', 'd', def.peq));
    f.appendChild(cuerpo);
    var st = nodo('div', 'stepper');
    var bMenos = nodo('button', ''); bMenos.type = 'button'; bMenos.appendChild(ico('menos')); bMenos.setAttribute('aria-label', 'menos');
    var val = nodo('div', 'stepper-val', etiquetaNumero(actual, def));
    var bMas = nodo('button', ''); bMas.type = 'button'; bMas.appendChild(ico('mas')); bMas.setAttribute('aria-label', 'más');
    st.appendChild(bMenos); st.appendChild(nodo('div', 'div')); st.appendChild(val); st.appendChild(nodo('div', 'div')); st.appendChild(bMas);
    var pendiente = actual, timer = null;
    function refresca() { val.textContent = etiquetaNumero(pendiente, def); bMenos.disabled = pendiente <= min; bMas.disabled = pendiente >= max; }
    function commit() {
      if (pendiente === actual) return;
      // Si un guardado de esta clave sigue en vuelo, reintenta luego (no pierde el último cambio).
      if (estado.guardando[def.clave]) { clearTimeout(timer); timer = setTimeout(commit, 350); return; }
      var prev = actual;
      guardaConfig(def.clave, String(pendiente), {
        prev: String(prev),
        // Sincroniza SIEMPRE el control con el valor guardado (también al Deshacer).

      });
    }

      var nv = pendiente + delta * paso; if (nv < min) nv = min; if (nv > max) nv = max;
      if (nv === pendiente) return;

    }
    bMenos.addEventListener('click', function () { ajusta(-1); });

  }

  /* ---- Sus citas por semana (Fase 0 del tablero de decisiones, 15-jul) ----
     Regla que gobierna este módulo: JAMÁS inventar. Si el calendario no
     responde, lo dice; si no hay semanas suficientes, lo dice; y la banda de
     ruido existe para que el Dr. NO reaccione a la suerte. */
  var SVGNS = 'http://www.w3.org/2000/svg';
  function svgNodo(tag, attrs, estilos) {
    var e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    // Los colores van por STYLE, no por atributo: var(--token) no resuelve como
    // atributo de presentación, y así el dark mode funciona solo.
    Object.keys(estilos || {}).forEach(function (k) { e.style[k] = estilos[k]; });
    return e;
  }
  function svgTexto(x, y, txt, tam, color, ancla) {
    var t = svgNodo('text', { x: x, y: y, 'text-anchor': ancla || 'middle', 'font-size': tam },
      { fill: color, fontWeight: '600' });
    t.textContent = txt; // textContent, nunca innerHTML
    return t;
  }
  function graficaTendencia(t) {
    var sem = t.semanas || [];
    var W = 320, H = 138, padL = 8, padR = 8, padT = 14, padB = 20;
    var svg = svgNodo('svg', {
      viewBox: '0 0 ' + W + ' ' + H,
      preserveAspectRatio: 'xMidYMid meet',
      role: 'img',
      'aria-label': resumenTendenciaTexto(t)
    }, { width: '100%', height: 'auto', display: 'block' });
    var techo = Math.max.apply(null, sem.map(function (s) { return s.citas; })
      .concat([t.banda_alta || 0, 1]));
    var y = function (v) { return padT + (H - padT - padB) * (1 - v / techo); };
    // Banda de ruido: el rango donde una semana NO significa nada.
    if (t.suficiente && t.banda_alta !== null && t.banda_alta !== undefined) {
      svg.appendChild(svgNodo('rect', {
        x: padL, y: y(t.banda_alta), width: W - padL - padR,
        height: Math.max(1, y(t.banda_baja) - y(t.banda_alta)), rx: 4
      }, { fill: 'var(--acento)', opacity: '.14' }));
      svg.appendChild(svgNodo('line', {
        x1: padL, x2: W - padR, y1: y(t.promedio), y2: y(t.promedio), 'stroke-dasharray': '4 3'
      }, { stroke: 'var(--acento)', strokeWidth: '1.5', opacity: '.9' }));
    }
    var paso = (W - padL - padR) / (sem.length || 1);
    var ancho = Math.min(24, paso * 0.55);
    sem.forEach(function (s, i) {
      var cx = padL + paso * (i + 0.5);
      var yv = y(s.citas);
      // Fuera de la banda = merece mirada; dentro = ruido. El color NO es el
      // único portador: el número va escrito encima de cada barra.
      var fuera = t.suficiente && (s.citas > t.banda_alta || s.citas < t.banda_baja);
      svg.appendChild(svgNodo('rect', {
        x: cx - ancho / 2, y: yv, width: ancho, height: Math.max(2, (H - padB) - yv), rx: 3
      }, { fill: fuera ? 'var(--ambar)' : 'var(--ink-3)', opacity: fuera ? '.95' : '.6' }));
      svg.appendChild(svgTexto(cx, yv - 4, String(s.citas), 9.5, 'var(--ink-2)'));
      svg.appendChild(svgTexto(cx, H - 6, s.etiqueta, 8.5, 'var(--ink-3)'));
    });
    return svg;
  }
  function resumenTendenciaTexto(t) {

      t.banda_baja + ' a ' + t.banda_alta + ' citas por semana.';
  }
  /* ---- Sus citas vs las del Dr. Castañeda (petición del Dr., 15-jul) ----
     Separa SOLO lo que tiene doctor de verdad (las citas). Si el servidor no

  function moduloDesgloseDoctor(v, m) {

    if (t.semana_en_curso !== null && t.semana_en_curso !== undefined) {
      avisos.push('La semana en curso (' + t.semana_en_curso +
        (t.semana_en_curso === 1 ? ' cita' : ' citas') + ' hasta hoy) no se grafica: todavía no termina.');
    }
    if (t.excluidas_mauricio) {
      avisos.push('No se contaron ' + t.excluidas_mauricio + ' citas del Dr. Castañeda.');
    }
    if (t.sin_identificar) {
      avisos.push(t.sin_identificar + (t.sin_identificar === 1 ? ' cita no dice' : ' citas no dicen') +
        ' de qué doctor son en el título del calendario, así que no se contaron.');
    }
    avisos.push('Las consultas a domicilio no se registran en el calendario, así que aquí no aparecen.');
    notaBajo(v, avisos.join(' '));
  }

  /* ---- Qué hacer esta semana (capa de decisiones, 25-jul) ----
     El servidor cruza embudo + citas + Google Ads y manda una lista corta de
     acciones en español llano, cada una con su evidencia. El nivel va como
     PALABRA además del color (el color nunca es el único portador). */
  var NIVELES_DEC = {
    accion: { et: 'HACER', color: 'var(--ambar)' },
    atencion: { et: 'OJO', color: 'var(--azul)' },
    bien: { et: 'BIEN', color: 'var(--verde)' }
  };
  function moduloDecisiones(v, dec) {
    var g = seccion(v, 'Qué hacer esta semana');
    (dec.items || []).forEach(function (it) {
      var f = nodo('div', 'fila'); var cu = nodo('div', 'cuerpo');
      var niv = NIVELES_DEC[it.nivel] || NIVELES_DEC.atencion;
      var t = nodo('div', 't');
      var chip = nodo('b', '', niv.et + ' · ');
      chip.style.color = niv.color;
      t.appendChild(chip);
      t.appendChild(document.createTextNode(String(it.titulo || '')));
      cu.appendChild(t);
      cu.appendChild(nodo('div', 'd', String(it.detalle || '')));
      f.appendChild(cu); g.appendChild(f);
    });
    notaBajo(v, 'Estas recomendaciones se arman solas cruzando sus citas, el embudo del bot y sus números de Google. ' +
      'Nunca le voy a recomendar bajarle a una campaña: una cita perdida cuesta más que lo que se ahorra.');
  }

  /* ---- Embudo visual (25-jul (6)) ----
     Los MISMOS números de los mosaicos, como cascada: cada barra es un paso y
     su ancho es proporcional al paso anterior. El número va escrito SIEMPRE
     (el largo solo acompaña). */
  function moduloEmbudo(v, m) {
    var pasos = [
      ['Conversaciones', Number(m.conversaciones) || 0],
      ['Empezaron a agendar', Number(m.flujos) || 0],
      ['Reservaron', Number(m.reservas) || 0],
      ['Confirmaron', Number(m.confirmadas) || 0]
    ];
    if (!pasos[0][1]) return; // sin boca de embudo no hay nada que dibujar
    var g = seccion(v, 'Su embudo, de un vistazo');
    var f = nodo('div', 'fila'); var cu = nodo('div', 'cuerpo');
    var W = 320, alto = 26, gap = 20, H = pasos.length * (alto + gap) - gap + 6;
    var svg = svgNodo('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
      'aria-label': pasos.map(function (p) { return p[0] + ': ' + p[1]; }).join('. ') },
      { width: '100%', height: 'auto', display: 'block' });
    var max = pasos[0][1];
    var colores = ['var(--indigo)', 'var(--azul)', 'var(--acento)', 'var(--verde)'];
    pasos.forEach(function (p, i) {
      var y = i * (alto + gap);
      var w = Math.max(6, Math.round((W - 4) * (p[1] / max)));
      svg.appendChild(svgNodo('rect', { x: 2, y: y, width: W - 4, height: alto, rx: 6 },
        { fill: 'var(--chip-bg)' }));
      svg.appendChild(svgNodo('rect', { x: 2, y: y, width: w, height: alto, rx: 6 },
        { fill: colores[i], opacity: '.85' }));
      svg.appendChild(svgTexto(8, y + alto - 8, p[0] + ': ' + p[1], 11, 'var(--ink)', 'start'));
      // % de conversión respecto al paso ANTERIOR, escrito entre barras.
      if (i > 0 && pasos[i - 1][1] > 0) {
        var pct = Math.round(p[1] / pasos[i - 1][1] * 100);

      }
    });
    cu.appendChild(svg);
    f.appendChild(cu); g.appendChild(f);
  }

  /* ---- Su clientela (25-jul (6)) ----
     Contactos NUEVOS por semana (boca del embudo, ventana viva de 30 días) y
     el acumulado real: pacientes que ya llegaron a cita desde que el bot
     arrancó. Honesto: "nuevo" = primer mensaje en 30 días (no hay más
     historia), y el conteo junta a los dos doctores. */
  function moduloClientela(v, c) {
    var g = seccion(v, 'Su clientela');
    if (c.con_cita !== null && c.con_cita !== undefined) {
      var f0 = nodo('div', 'fila'); var cu0 = nodo('div', 'cuerpo');
      cu0.appendChild(nodo('div', 't', c.con_cita + ' pacientes han llegado a cita desde que el asistente arrancó'));
      cu0.appendChild(nodo('div', 'd', 'De ' + (c.total_pacientes || 0) +
        ' personas registradas que han escrito. Es su clientela acumulada por WhatsApp (ambos consultorios), desde julio.'));
      f0.appendChild(cu0); g.appendChild(f0);
    }
    var sem = c.semanas || [];
    if (sem.length) {
      var f1 = nodo('div', 'fila'); var cu1 = nodo('div', 'cuerpo');
      cu1.appendChild(nodo('div', 't', 'Personas nuevas que escriben, por semana'));
      var W = 320, H = 120, padT = 14, padB = 20;
      var svg = svgNodo('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
        'aria-label': 'Contactos nuevos por semana: ' + sem.map(function (s) { return s.nuevos; }).join(', ') },
        { width: '100%', height: 'auto', display: 'block' });
      var techo = Math.max.apply(null, sem.map(function (s) { return s.nuevos; }).concat([1]));
      var paso = W / sem.length;
      var ancho = Math.min(30, paso * 0.55);
      sem.forEach(function (s, i) {
        var cx = paso * (i + 0.5);
        var hBar = Math.max(2, (H - padT - padB) * (s.nuevos / techo));
        var y = H - padB - hBar;
        svg.appendChild(svgNodo('rect', { x: cx - ancho / 2, y: y, width: ancho, height: hBar, rx: 3 },
          { fill: 'var(--verde)', opacity: '.8' }));
        svg.appendChild(svgTexto(cx, y - 4, String(s.nuevos), 9.5, 'var(--ink-2)'));
        svg.appendChild(svgTexto(cx, H - 6, s.etiqueta, 8.5, 'var(--ink-3)'));
      });
      cu1.appendChild(svg);
      if (c.semana_en_curso !== null && c.semana_en_curso !== undefined) {
        cu1.appendChild(nodo('div', 'd', 'La semana en curso lleva ' + c.semana_en_curso +
          (c.semana_en_curso === 1 ? ' persona nueva' : ' personas nuevas') + '; no se grafica porque no ha terminado.'));
      }
      f1.appendChild(cu1); g.appendChild(f1);
    }
    notaBajo(v, '"Nueva" = su primer mensaje en los últimos 30 días (el historial del bot no guarda más). ' +
      'El acumulado de pacientes sí es desde el arranque, porque vive en su lista de pacientes, no en el historial.');
  }

  /* ---- Su dinero en Google (Fase 1 del tablero, 15-jul) ----
     Regla: el panel JAMÁS inventa. Si el script no corrió, lo dice; si Google
     no reporta un dato, lo dice; y nunca recomienda BAJAR el presupuesto (la
     asimetría: una cita perdida cuesta más que lo que se ahorra). */
  // Cada veredicto trae su FRASE COMPLETA, no un sufijo pegado: con una
  // plantilla común salía "SIN DATO el presupuesto" y "EN CAMBIO el
  // presupuesto", que no son español.
  var VEREDICTOS = {
    'SUBIR': { color: 'var(--verde)', glifo: '▲', frase: 'SUBIR el presupuesto' },
    'MANTENER': { color: 'var(--ink-3)', glifo: '=', frase: 'MANTENER el presupuesto' },
    'EN CAMBIO': { color: 'var(--azul)', glifo: '◔', frase: 'ESPERAR: cambio reciente' },
    'SIN DATO': { color: 'var(--ink-3)', glifo: '?', frase: 'SIN DATOS suficientes' }
  };
  function barraIS(pctPres, pctRank) {
    // Dos barras comparables: presupuesto vs ranking. La FORMA y el número
    // portan el significado; el color solo acompaña.
    var W = 320, H = 44;
    var svg = svgNodo('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
      'aria-label': 'Dejó de aparecer ' + pctPres + '% por presupuesto y ' + pctRank + '% porque otros quedaron arriba.' },
      { width: '100%', height: 'auto', display: 'block' });
    [{ p: pctPres, y: 4, et: 'por presupuesto', c: 'var(--ambar)' },
     { p: pctRank, y: 26, et: 'por calidad del anuncio', c: 'var(--indigo)' }].forEach(function (b) {
      svg.appendChild(svgNodo('rect', { x: 108, y: b.y, width: W - 116, height: 12, rx: 6 },
        { fill: 'var(--chip-bg)' }));
      svg.appendChild(svgNodo('rect', { x: 108, y: b.y, width: Math.max(2, (W - 116) * (b.p / 100)), height: 12, rx: 6 },
        { fill: b.c }));
      svg.appendChild(svgTexto(104, b.y + 10, b.et, 8.5, 'var(--ink-3)', 'end'));
      svg.appendChild(svgTexto(W - 4, b.y + 10, b.p + '%', 9, 'var(--ink-2)', 'end'));
    });
    return svg;
  }
  function filaCampana(c) {
    var f = nodo('div', 'fila');
    var cu = nodo('div', 'cuerpo');
    var v = VEREDICTOS[c.veredicto] || VEREDICTOS['SIN DATO'];
    var t = nodo('div', 't', c.nombre);
    cu.appendChild(t);
    // El veredicto va como PALABRA, no como color: el color nunca es el único
    // portador del significado.
    var chip = nodo('div', 'd');
    var b = nodo('b', '', v.glifo + ' ' + v.frase);
    b.style.color = v.color;
    chip.appendChild(b);
    cu.appendChild(chip);
    cu.appendChild(nodo('div', 'd', c.porque));
    var det = 'Gasta $' + c.gasto.toLocaleString('es-MX') + ' en 4 semanas' +
      (c.presupuesto_diario ? ' · tope de $' + c.presupuesto_diario.toLocaleString('es-MX') + ' al día' : '');
    cu.appendChild(nodo('div', 'd', det));
    // CTR con vara de comparación (25-jul): de cada 100 que VIERON el anuncio,
    // cuántos lo tocaron. Lo típico en salud anda entre 5 y 6 (auditoría
    // 18-jul). Solo si el servidor lo mandó (null = pocas impresiones).
    if (c.ctr !== null && c.ctr !== undefined) {
      cu.appendChild(nodo('div', 'd', 'De cada 100 personas que vieron su anuncio, ' +
        String(c.ctr).replace('.', ',') + ' lo tocaron' +
        (c.ctr >= 5 ? ' — igual o mejor que lo típico en salud (5–6).' : ' — lo típico en salud es 5–6; hay margen en el texto del anuncio.')));
    }
    if (c.perdido_presupuesto !== null && c.perdido_ranking !== null) {
      cu.appendChild(barraIS(c.perdido_presupuesto, c.perdido_ranking));
    }
    f.appendChild(cu);
    return f;
  }
  function moduloAds(v, a, tend) {
    var g = seccion(v, 'Su dinero en Google');
    var f = nodo('div', 'fila'); var cu = nodo('div', 'cuerpo');

    if (a.estado === 'sin_configurar') {
      cu.appendChild(nodo('div', 't', 'Aún no conectado'));
      cu.appendChild(nodo('div', 'd', 'Falta un paso suyo de 2 minutos, una sola vez: autorizar el informe dentro de Google Ads. ' +
        'Mientras tanto no puedo mostrarle su gasto, y prefiero decírselo a inventarlo. Pídame los pasos y se los doy.'));
      f.appendChild(cu); g.appendChild(f);
      return;
    }
    if (a.estado === 'rancio') {
      cu.appendChild(nodo('div', 't', 'No pude actualizar sus números de Google'));
      cu.appendChild(nodo('div', 'd', 'El último dato es del ' + (a.ultima_actualizacion || 'hace tiempo') +
        '. No se los muestro porque se verían sanos y serían viejos. Sus citas sí están al día, aquí arriba. William ya está enterado.'));
      f.appendChild(cu); g.appendChild(f);
      return;
    }

    // 1) Lo que gastó y lo que llegó, lado a lado. Es lo que hoy nadie ve junto.
    var citas4 = null;
    if (tend && (tend.semanas || []).length >= 4) {
      citas4 = tend.semanas.slice(-4).reduce(function (s, x) { return s + x.citas; }, 0);
    }
    cu.appendChild(nodo('div', 't', 'En 4 semanas gastó $' + (a.gasto_28d || 0).toLocaleString('es-MX') +
      (citas4 !== null ? ' y tuvo ' + citas4 + ' citas' : '')));
    if (citas4 !== null && citas4 > 0) {
      var porCita = Math.round((a.gasto_28d || 0) / citas4);
      // ROTULO HONESTO: no es el costo por cita que trajo Google. El
      // denominador incluye TODAS sus citas (orgánicas, recurrentes, boca en
      // boca), así que el costo real de Google por cita es MAYOR que esto.
      // Cuánto, no se sabe: no hay forma de saber de qué campaña vino cada
      // paciente. Rotularlo "CPA" sería mentir.
      cu.appendChild(nodo('div', 'd', 'Son $' + porCita.toLocaleString('es-MX') +
        ' de gasto de Google por cada una de TODAS sus citas — incluidas las que Google no le trajo. ' +
        'Su costo real por paciente de Google es mayor que eso; cuánto, no se puede saber todavía.'));
    }
    cu.appendChild(nodo('div', 'd', 'Datos de Google al ' + (a.ultima_actualizacion || '—') + '. Se actualizan solos cada noche.'));
    f.appendChild(cu); g.appendChild(f);

    // 2) Campaña por campaña, con la decisión escrita.
    if ((a.campanas || []).length) {
      var g2 = seccion(v, '¿Le subo o le bajo a cada campaña?');
      a.campanas.forEach(function (c) { g2.appendChild(filaCampana(c)); });
      notaBajo(v, 'Nunca le voy a recomendar bajarle a una campaña por una mala racha: con este número de pacientes, ' +
        'una semana floja casi siempre es suerte, y una cita perdida cuesta más que lo que se ahorra.');
    }

    // 2.5) En qué servicio se va el dinero (grupos de anuncio). "Contactos"
    // son los que cuenta Google (clic al WhatsApp), NO citas confirmadas: el
    // rótulo lo dice para no vestir de cita lo que solo es un clic.
    if ((a.grupos || []).length) {
      var g25 = seccion(v, 'En qué se va su dinero, servicio por servicio');
      var maxG = a.grupos[0].gasto || 1;
      a.grupos.forEach(function (gr) {
        var fg = nodo('div', 'fila'); var cg = nodo('div', 'cuerpo');
        cg.appendChild(nodo('div', 't', gr.nombre));
        var det = '$' + gr.gasto.toLocaleString('es-MX') + ' en 4 semanas · ' +
          gr.clics + (gr.clics === 1 ? ' clic' : ' clics') + ' · ' +
          (gr.contactos > 0
            ? gr.contactos + ' contactos (~$' + Math.round(gr.gasto / gr.contactos).toLocaleString('es-MX') + ' cada uno)'
            : 'ningún contacto');
        cg.appendChild(nodo('div', 'd', det));
        // Barra de proporción del gasto (la más cara = barra llena). El número
        // va escrito arriba: el largo solo acompaña, no es el único portador.
        var barra = nodo('div', '');
        barra.style.cssText = 'height:8px;border-radius:4px;background:var(--chip-bg);margin-top:6px;overflow:hidden;';
        var seg = nodo('div', '');
        seg.style.cssText = 'height:100%;border-radius:4px;background:var(--indigo);width:' +
          Math.max(3, Math.round(gr.gasto / maxG * 100)) + '%;';
        barra.appendChild(seg);
        cg.appendChild(barra);
        fg.appendChild(cg); g25.appendChild(fg);
      });
      notaBajo(v, 'Un "contacto" es lo que Google alcanza a contar: alguien que tocó su anuncio y abrió el WhatsApp. ' +
        'No toda persona que abre el chat agenda, así que el costo por paciente real es mayor.');
    }

    // 3) Dónde se va el dinero sin producir un solo contacto.
    if ((a.desperdicio || []).length) {
      var g3 = seccion(v, 'Búsquedas que le costaron sin traer a nadie');
      a.desperdicio.slice(0, 8).forEach(function (d) {
        var fd = nodo('div', 'fila'); var cd = nodo('div', 'cuerpo');
        cd.appendChild(nodo('div', 't', '"' + d.termino + '"'));
        cd.appendChild(nodo('div', 'd', '$' + d.gasto.toLocaleString('es-MX') + ' en 4 semanas · ' +
          d.clics + (d.clics === 1 ? ' clic' : ' clics') + ' · ningún contacto'));
        fd.appendChild(cd); g3.appendChild(fd);
      });
      notaBajo(v, 'Son búsquedas reales por las que pagó. Dígame cuáles NO son de lo suyo y las bloqueo. ' +
        'Ojo: que alguien busque precio no es motivo para bloquearla.');
    }
  }

  /* ---- De dónde llegan sus contactos (25-jul) ----
     Cada botón del sitio manda un mensaje inicial distinto: por eso sabemos de
     qué página o promoción vino cada contacto. Solo se cuenta a quien llegó
     con ese mensaje; el que escribe con sus propias palabras no se etiqueta. */
  function moduloOrigenes(v, o) {
    var g = seccion(v, 'De dónde llegan sus contactos (30 días)');
    var max = (o.items[0] && o.items[0].leads) || 1;
    o.items.forEach(function (it) {
      var f = nodo('div', 'fila'); var cu = nodo('div', 'cuerpo');
      cu.appendChild(nodo('div', 't', it.etiqueta));
      cu.appendChild(nodo('div', 'd', it.leads + (it.leads === 1 ? ' contacto' : ' contactos') +
        ' · ' + it.con_cita + (it.con_cita === 1 ? ' llegó a cita' : ' llegaron a cita')));
      var barra = nodo('div', '');
      barra.style.cssText = 'height:8px;border-radius:4px;background:var(--chip-bg);margin-top:6px;overflow:hidden;';
      var seg = nodo('div', '');
      seg.style.cssText = 'height:100%;border-radius:4px;background:var(--verde);width:' +
        Math.max(3, Math.round(it.leads / max * 100)) + '%;';
      barra.appendChild(seg);
      cu.appendChild(barra);
      f.appendChild(cu); g.appendChild(f);
    });
    notaBajo(v, 'Solo se cuenta a quien llegó tocando un botón del sitio (cada botón manda un mensaje distinto y eso delata la página). ' +
      'Quien nos escribe con sus propias palabras no aparece aquí — no adivinamos.');
  }

  /* ---- Más ---- */
  function estatusPlantillaES(e) {
    var m = { APPROVED: 'aprobada', PENDING: 'en revisión', IN_APPEAL: 'en apelación', REJECTED: 'rechazada', DISABLED: 'desactivada', PAUSED: 'pausada', FLAGGED: 'marcada' };
    return m[e] || String(e || '').toLowerCase();
  }
  function categoriaPlantillaES(c) {
    var m = { MARKETING: 'marketing · ~$0.55/envío', UTILITY: 'de servicio · ~$0.15/envío', AUTHENTICATION: 'autenticación' };
    return m[c] || String(c || '').toLowerCase();
  }
  function idiomaES(x) { x = String(x || ''); if (/^es/i.test(x)) return 'español'; if (/^en/i.test(x)) return 'inglés'; return x; }
  function vistaMas(v) {

    // Estado del sistema
    var g = seccion(v, 'Estado del sistema');

    (s.deployments || []).forEach(function (dep, i) {
      var f = nodo('div', 'fila');
      f.appendChild(nodo('span', 'punto ' + (dep.al_dia ? 'ok' : 'mal')));
      var cu = nodo('div', 'cuerpo'); cu.appendChild(nodo('div', 't', 'Servidor ' + (i + 1)));
      if (dep.v) cu.appendChild(nodo('div', 'd', 'versión ' + dep.v));
      f.appendChild(cu);
      f.appendChild(nodo('div', 'valor-der', dep.al_dia ? 'al día' : (dep.v ? 'actualizándose' : 'sin respuesta')));

    var fw = nodo('div', 'fila');

    var cw = nodo('div', 'cuerpo'); cw.appendChild(nodo('div', 't', 'Recepción de mensajes')); fw.appendChild(cw);
    fw.appendChild(nodo('div', 'valor-der', s.worker_ok ? 'operando' : 'revisar'));
    g.appendChild(fw);

    // Plantillas

    } else if (!p.items.length) {

    } else {
      p.items.forEach(function (pl) {
        var f = nodo('div', 'plantilla');
        f.appendChild(nodo('span', 'nom', pl.nombre + ' · ' + idiomaES(pl.idioma)));
        var est = String(pl.estatus || '').toUpperCase();
        var claseEst = est === 'APPROVED' ? 'aprobada' : (est === 'PENDING' || est === 'IN_APPEAL' ? 'pendiente' : 'rechazada');
        f.appendChild(nodo('span', 'chip ' + claseEst, estatusPlantillaES(est)));
        var cat = String(pl.categoria || '').toUpperCase();
        if (cat) f.appendChild(nodo('span', 'chip' + (cat === 'MARKETING' ? ' marketing' : ''), categoriaPlantillaES(cat)));
        gp.appendChild(f);
      });
    }
    notaBajo(v, 'Si Meta recategoriza una plantilla a "marketing", todo sigue funcionando; solo sube un poco el costo de ese envío.');

    // Campañas / etiquetas
    var etq = estado.datos.etiquetas || {};
    var ETQ = [['EPOC', 'EPOC'], ['ASMA', 'Asma'], ['EPID', 'EPID'], ['CRONICO', 'Crónico'], ['MAYOR55', '>55 años']];
    var gc = seccion(v, 'Campañas (pacientes etiquetados)');
    var fila = nodo('div', 'etq-fila');
    ETQ.forEach(function (e) {
      var chip = nodo('span', 'etq');
      chip.appendChild(nodo('b', '', String(etq[e[0]] === undefined ? 0 : etq[e[0]])));
      chip.appendChild(document.createTextNode(e[1]));
      fila.appendChild(chip);
    });
    gc.appendChild(fila);
    notaBajo(v, 'Etiquete pacientes desde la ficha ⓘ de cada chat en el visor. Alimentan la reactivación de crónicos y la campaña de vacunación (octubre 2026).');

    // Cambios recientes
    var cambios = estado.datos.cambios || [];
    if (cambios.length) {
      var gch = seccion(v, 'Últimos cambios que usted hizo');
      cambios.forEach(function (c) {
        var el = nodo('div', 'cambio');
        el.appendChild(nodo('span', 'h', (c.ts || '') + '  '));
        el.appendChild(document.createTextNode(legibleCambio(c.texto)));
        gch.appendChild(el);
      });
    }

    // Cerrar sesión
    var gs = seccion(v, '');
    var salir = nodo('button', 'fila tocable'); salir.type = 'button';
    salir.appendChild(iconoCuad('', 'var(--rojo)')); salir.firstChild.appendChild(icoBlanco('salir'));
    var cs = nodo('div', 'cuerpo'); cs.appendChild(nodo('div', 't', 'Cerrar sesión')); salir.appendChild(cs);
    salir.addEventListener('click', function () {
      accionSheet({ titulo: 'Cerrar sesión', mensaje: 'Tendrá que ingresar su clave la próxima vez.',
        opciones: [{ texto: 'Cerrar sesión', peligro: true, fn: function () { borraClave(); muestraPuerta(false); } }] });
    });
    gs.appendChild(salir);

    v.appendChild(nodo('div', 'nota', 'Panel del Dr. William Lara · versión ' + ((estado.datos && estado.datos.version_head) || '') +
      ' · actualizado ' + String((estado.datos && estado.datos.generado) || '').slice(11, 16)));
  }
  function legibleCambio(t) {
    t = String(t || '');
    var m = t.match(/^([A-Z0-9_]+)\s*->\s*(.*)$/);
    if (m) { var def = CAMPOS_DEF[m[1]]; return (def ? def.etiqueta : humaniza(m[1])) + ' → ' + m[2]; }
    return t;
  }

  /* ================== Reordenamiento (modo edición) ================== */
  function mandoEdit(id, tipo) {
    var m = nodo('div', 'mando-edit');
    var agarre = nodo('div', 'agarre'); agarre.appendChild(ico('agarre')); agarre.dataset.agarre = '1';
    m.appendChild(agarre);
    m.appendChild(nodo('div', 'titmov', nombreCard(id)));
    var subir = nodo('button', 'mini'); subir.type = 'button'; subir.appendChild(rot(ico('atras'), 90)); subir.title = 'Subir';
    var bajar = nodo('button', 'mini'); bajar.type = 'button'; bajar.appendChild(rot(ico('atras'), -90)); bajar.title = 'Bajar';
    var ojo = nodo('button', 'mini ojo'); ojo.type = 'button';
    var oculto = !!estado.layout.ocultos[id];
    ojo.appendChild(ico(oculto ? 'ojoOff' : 'ojo')); if (oculto) ojo.classList.add('oculto');
    subir.addEventListener('click', function () { mueveCard(id, -1); });
    bajar.addEventListener('click', function () { mueveCard(id, 1); });
    ojo.addEventListener('click', function () {
      estado.layout.ocultos[id] = !estado.layout.ocultos[id]; guardaLayout(); pinta();
    });
    var idx = estado.layout.orden.indexOf(id);
    subir.disabled = idx <= 0; bajar.disabled = idx >= estado.layout.orden.length - 1;
    m.appendChild(subir); m.appendChild(bajar); m.appendChild(ojo);
    return m;
  }
  function rot(svg, deg) { svg.style.transform = 'rotate(' + deg + 'deg)'; return svg; }
  function nombreCard(id) { return ({ agenda: 'Agenda', metricas: 'Métricas', acciones: 'Acciones rápidas' })[id] || id; }
  function mueveCard(id, dir) {
    var o = estado.layout.orden, i = o.indexOf(id), j = i + dir;
    if (i === -1 || j < 0 || j >= o.length) return;
    o.splice(i, 1); o.splice(j, 0, id); guardaLayout(); pinta();
  }
  function activaReorden(cont, tipo, alSoltar) {
    var arrastrando = null;
    cont.querySelectorAll('[data-agarre]').forEach(function (agarre) {
      agarre.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        var card = agarre.closest('.tarjeta-mov'); if (!card) return;
        arrastrando = card; card.classList.add('arrastrando');
        try { agarre.setPointerCapture(e.pointerId); } catch (er) {}
        function mover(ev) {
          if (!arrastrando) return;
          var hijos = Array.prototype.slice.call(cont.children).filter(function (c) { return c !== arrastrando; });
          var puestoAntes = null;
          hijos.forEach(function (sib) {
            var r = sib.getBoundingClientRect();
            if (ev.clientY > r.top + r.height / 2) puestoAntes = sib;
          });
          if (puestoAntes) { if (puestoAntes.nextSibling !== arrastrando) cont.insertBefore(arrastrando, puestoAntes.nextSibling); }
          else { if (cont.firstElementChild !== arrastrando) cont.insertBefore(arrastrando, cont.firstElementChild); }
        }
        function soltar() {
          if (!arrastrando) return;
          arrastrando.classList.remove('arrastrando'); arrastrando = null;
          agarre.removeEventListener('pointermove', mover);
          agarre.removeEventListener('pointerup', soltar);
          agarre.removeEventListener('pointercancel', soltar);
          var nuevo = Array.prototype.slice.call(cont.children).map(function (c) { return c.dataset.card; }).filter(Boolean);
          alSoltar(nuevo); pinta();
        }
        agarre.addEventListener('pointermove', mover);
        agarre.addEventListener('pointerup', soltar);
        agarre.addEventListener('pointercancel', soltar);
      });
    });
  }

  /* ================== Utilidades ================== */
  function saludoFecha() {
    var d = new Date(); var hh = d.getHours();
    var saludo = hh < 12 ? 'Buenos días' : (hh < 19 ? 'Buenas tardes' : 'Buenas noches');
    return saludo + ', doctor.';
  }

  /* ================== Eventos globales ================== */
  $('formaClave').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var val = $('clave').value.trim(); if (!val) return;
    $('clave').value = ''; puertaCargando(true); $('fallo').style.display = 'none';
    carga(val);
  });
  $('btnRefrescar').addEventListener('click', function () { if (!estado.cargando) carga(); });
  $('btnAtras').addEventListener('click', function () { try { history.back(); } catch (e) { irA('ajustes'); } });
  $('btnEditar').addEventListener('click', function () {
    estado.editando = !estado.editando; pinta();
    if (!estado.editando) avisa('Vista de Inicio guardada.');
  });

  /* ================== Arranque ================== */
  try {
    var vh = (location.hash || '').replace('#', '');
    if (vh && (vh === 'ajustes' || vh === 'resultados' || vh === 'mas' || vh.indexOf('grupo:') === 0)) estado.vista = vh;
    // Siembra el historial para que "Atrás" funcione al entrar directo a un grupo por enlace.
    if (estado.vista.indexOf('grupo:') === 0) {
      history.replaceState({ vista: 'ajustes' }, '', '#ajustes');
      history.pushState({ vista: estado.vista }, '', '#' + estado.vista);
    } else {
      history.replaceState({ vista: estado.vista }, '', '#' + estado.vista);
    }
  } catch (e) {}
  if (claveGuardada()) puertaCargando(true);
  construyeTabs();
  carga();
})();
</script>
